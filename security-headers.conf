# ══════════════════════════════════════════════════════════════════
# En-têtes de sécurité HTTP du portail SPAWT — défense en profondeur.
#
# Le portail gère l'auth OTP ET le tunnel de paiement : surface sensible,
# on verrouille comme pour une mise en production.
#
# SOURCE DE VÉRITÉ UNIQUE : ce fichier est inclus (`include`) au niveau
# `server` ET dans CHAQUE bloc `location` de nginx.conf. Raison (piège nginx
# classique) : nginx N'HÉRITE PAS les `add_header` d'un niveau parent dès
# qu'un bloc enfant définit ne serait-ce qu'UN `add_header` (ici
# Cache-Control). Sans ce ré-`include`, la CSP tomberait précisément sur la
# réponse HTML (servie par `location /`, qui pose son propre Cache-Control).
# `always` : l'en-tête est émis même sur les réponses d'erreur (404…).
# ══════════════════════════════════════════════════════════════════

# ── Content-Security-Policy ────────────────────────────────────────
# Inventaire RÉEL des origines contactées par le portail (audit de src/lib/*,
# index.html, @font-face, build dist/) :
#
#  • default-src 'self'   — repli : tout ce qui n'est pas listé plus bas doit
#    être same-origin. Couvre aussi worker/manifest/media/frame (le portail
#    n'en a aucun hors origine).
#
#  • connect-src 'self' https://api.spawt.online — les SEULS fetch/XHR du
#    portail visent le Supabase self-hosted : REST `/rest/v1/*` (entitlements,
#    factures, vues B2B, ambassadeurs) + Edge `/functions/v1/*` (otp-send,
#    otp-verify, payment-checkout) + refresh de session GoTrue `/auth/v1/*`.
#    L'URL est figée AU BUILD via VITE_SUPABASE_URL ; en prod = api.spawt.online.
#    ⚠️ DÉPLOIEMENT : si VITE_SUPABASE_URL pointe vers un AUTRE hôte Supabase
#    (projet cloud `*.supabase.co`, préprod, autre VPS…), il FAUT ajouter cet
#    hôte ici — sinon le navigateur bloquera tous les appels REST/Edge et le
#    portail ne pourra ni connecter ni faire payer. (cf. README, déploiement.)
#    Le checkout CinetPay n'a AUCUNE entrée à ajouter : c'est une redirection
#    pleine page (window.location = payment_url), pas un fetch ni une iframe —
#    la navigation top-level n'est pas régie par la CSP.
#
#  • img-src 'self' data:  — favicon.svg + assets locaux ; `data:` par
#    précaution (petites images inlinables). Aucune image d'hôte externe.
#
#  • font-src 'self'       — Klinsman + Gotham servies depuis /fonts/. Aucune
#    police distante (pas de Google Fonts / Typekit).
#
#  • style-src 'self' 'unsafe-inline' — la feuille /assets/*.css ('self') PLUS
#    les styles inline React (attribut `style={{…}}`, omniprésent : largeurs
#    de barres du dashboard, confetti à couleur dynamique…). 'unsafe-inline'
#    est nécessaire pour le style ; son coût de sécurité est faible (injecter
#    du style est bien moins dangereux qu'injecter du script) et on garde en
#    échange un script-src STRICT.
#
#  • script-src 'self'     — uniquement le bundle Vite /assets/*.js. Le build
#    NE produit AUCUN script inline (vérifié : dist/index.html ne contient
#    qu'une balise <script src>). Donc PAS de 'unsafe-inline' ni de
#    'unsafe-eval' : la directive la plus critique reste verrouillée.
#
#  • frame-ancestors 'none' — anti-clickjacking : le portail ne doit jamais
#    être embarqué en iframe (doublé par X-Frame-Options pour les vieux UA).
#  • object-src 'none'      — aucun plugin <object>/<embed>/<applet>.
#  • base-uri 'self'        — neutralise l'injection d'une balise <base>.
#  • form-action 'self'     — un <form> ne peut poster que same-origin (le
#    login OTP poste en JS via fetch ; le checkout part en window.location,
#    non concerné). Ferme l'exfiltration par formulaire détourné.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.spawt.online; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# ── En-têtes de sécurité complémentaires ───────────────────────────
add_header X-Frame-Options "DENY" always;                             # anti-clickjacking (legacy, redondant avec frame-ancestors)
add_header X-Content-Type-Options "nosniff" always;                   # coupe le MIME sniffing (protège surtout /assets/*.js|css)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # referrer minimal (la redirection CinetPay ne reçoit que l'origine)
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;  # le portail web n'utilise aucun de ces capteurs

# ── HSTS : VOLONTAIREMENT NON POSÉ ICI ─────────────────────────────
# Le TLS (et donc HSTS) est terminé EN AMONT : proxy Coolify / Cloudflare.
# Un HSTS mal réglé (max-age long, includeSubDomains posé trop tôt) peut
# rendre le domaine inaccessible et est difficile à révoquer — on ne le pose
# donc PAS au niveau applicatif. S'il doit un jour vivre ici, l'activer avec
# prudence (max-age court d'abord, puis l'allonger) :
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
