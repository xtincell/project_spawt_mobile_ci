# ══════════════════════════════════════════════════════════════════
# En-têtes de sécurité HTTP de la vitrine SPAWT — défense en profondeur.
#
# SOURCE DE VÉRITÉ UNIQUE : ce fichier est inclus (`include`) au niveau
# `server` ET dans CHAQUE bloc `location` de nginx.conf. Raison (piège nginx
# classique) : nginx N'HÉRITE PAS les `add_header` d'un niveau parent dès
# qu'un bloc enfant définit ne serait-ce qu'UN `add_header` (ici
# Cache-Control). Sans ce ré-`include`, la CSP tomberait précisément sur la
# réponse HTML (servie par `location /`, qui pose son propre Cache-Control).
# `always` : l'en-tête est émis même sur les réponses d'erreur (404…).
# ══════════════════════════════════════════════════════════════════

# ── Content-Security-Policy ────────────────────────────────────────
# Inventaire RÉEL des origines contactées par la vitrine (audit de src/,
# index.html, @font-face, build dist/) : AUCUNE. C'est une page statique.
#
#  • default-src 'self'   — repli : tout doit être same-origin.
#
#  • connect-src 'none'   — la vitrine ne fait AUCUN fetch/XHR/WebSocket.
#    Ce n'est pas une précaution, c'est un constat : plus de client Supabase,
#    plus d'Edge Function, plus de passerelle de paiement, aucun formulaire.
#    'none' plutôt que 'self' parce que c'est la valeur exacte, et parce
#    qu'elle transforme toute régression (un tracker ajouté à la va-vite, un
#    appel d'API réintroduit) en erreur visible en console au lieu d'un appel
#    silencieux. Si une vraie API devient nécessaire un jour, l'ouvrir ICI et
#    mettre à jour src/__tests__/security-headers.test.ts dans le même commit.
#
#  • img-src 'self' data:  — favicon + assets de /brand/. Aucune image
#    distante : les logos, Moka et les pictos sont servis depuis l'origine.
#
#  • font-src 'self'       — Klinsman + Gotham servies depuis /fonts/ en
#    WOFF2 (repli .otf/.ttf). Aucune police distante (ni Google Fonts, ni
#    Typekit) — ce qui est aussi la raison pour laquelle elles sont dans le
#    dépôt.
#
#  • style-src 'self' 'unsafe-inline' — la feuille /assets/*.css ('self')
#    PLUS les rares styles inline React (`style={{…}}`). 'unsafe-inline' est
#    nécessaire pour le style ; son coût est faible (injecter du style est
#    bien moins dangereux qu'injecter du script) et on garde en échange un
#    script-src STRICT.
#
#  • script-src 'self'     — uniquement le bundle Vite /assets/*.js. Le build
#    NE produit AUCUN script inline (dist/index.html ne contient qu'une balise
#    <script src>). Donc PAS de 'unsafe-inline' ni de 'unsafe-eval'.
#
#  • frame-ancestors 'none' — anti-clickjacking (doublé par X-Frame-Options).
#  • object-src 'none'      — aucun plugin <object>/<embed>/<applet>.
#  • base-uri 'self'        — neutralise l'injection d'une balise <base>.
#  • form-action 'none'     — la vitrine ne contient aucun <form>. Rien à
#    poster, donc rien à détourner.
add_header Content-Security-Policy "default-src 'self'; connect-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" always;

# ── En-têtes de sécurité complémentaires ───────────────────────────
add_header X-Frame-Options "DENY" always;                             # anti-clickjacking (legacy, redondant avec frame-ancestors)
add_header X-Content-Type-Options "nosniff" always;                   # coupe le MIME sniffing (protège surtout /assets/*.js|css)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # referrer minimal sur les liens sortants (quiz, Instagram)
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;  # la vitrine n'utilise aucun capteur

# ── HSTS : VOLONTAIREMENT NON POSÉ ICI ─────────────────────────────
# Le TLS (et donc HSTS) est terminé EN AMONT : proxy Coolify / Cloudflare.
# Un HSTS mal réglé (max-age long, includeSubDomains posé trop tôt) peut
# rendre le domaine inaccessible et est difficile à révoquer — on ne le pose
# donc PAS au niveau applicatif. S'il doit un jour vivre ici, l'activer avec
# prudence (max-age court d'abord, puis l'allonger) :
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
