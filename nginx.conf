# Configuration nginx du portail SPAWT (image de prod, cf. Dockerfile).
# SPA Vite : fallback try_files vers index.html pour les routes client
# (/gold, /connexion, /compte, /pro/..., /legal/...).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression : le trafic CI est mobile, chaque Ko compte.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/otf font/ttf;
    gzip_min_length 1024;

    # Assets fingerprintés par Vite : cache long, immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Polices : stables, cache long.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routes SPA : toute URL inconnue retombe sur index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
