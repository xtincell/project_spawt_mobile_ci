# Configuration nginx du portail SPAWT (image de prod, cf. Dockerfile).
# SPA Vite : fallback try_files vers index.html pour les routes client
# (/gold, /connexion, /compte, /pro/..., /legal/...).

server {
    listen 80;
    # IPv6 aussi : l'entrypoint nginx n'ajoute `listen [::]:80` que s'il
    # reconnaît son default.conf d'origine — le nôtre diffère, donc il ne
    # fait rien. Sans cette ligne, un `wget http://localhost/` (qui résout
    # ::1 en premier sous Alpine) tombe en « Connection refused » : le
    # HEALTHCHECK échoue et Coolify annule un déploiement pourtant sain.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (défense en profondeur) — source unique :
    # security-headers.conf. Ils sont RÉ-inclus dans chaque `location`
    # ci-dessous : nginx n'hérite pas les `add_header` d'un bloc parent dès
    # qu'un bloc enfant pose son propre `add_header` (Cache-Control). Sans ce
    # ré-include, la CSP disparaîtrait des réponses HTML et des assets.
    include /etc/nginx/security-headers.conf;

    # Compression : le trafic CI est mobile, chaque Ko compte.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/otf font/ttf;
    gzip_min_length 1024;

    # Assets fingerprintés par Vite : cache long, immutable.
    location /assets/ {
        include /etc/nginx/security-headers.conf;  # ré-include obligatoire (cf. note d'héritage plus haut)
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Polices : stables, cache long.
    location /fonts/ {
        include /etc/nginx/security-headers.conf;  # ré-include obligatoire (cf. note d'héritage plus haut)
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routes SPA : toute URL inconnue retombe sur index.html (réponse HTML :
    # c'est ICI que la CSP compte le plus — d'où le ré-include ci-dessous).
    location / {
        include /etc/nginx/security-headers.conf;  # ré-include obligatoire (cf. note d'héritage plus haut)
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
