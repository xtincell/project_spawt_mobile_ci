# nginx de la page « Bientôt ». Une seule page, pas de routage applicatif.
server {
    listen 80;
    # Cf. la note du Dockerfile : l'entrypoint nginx n'ajoute `listen [::]:80`
    # que s'il reconnaît son default.conf d'origine, et le nôtre diffère.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Défense en profondeur. La page n'appelle aucune origine externe : tout
    # est inline (styles, script, emoji). `connect-src 'none'` le verrouille —
    # si un jour quelqu'un ajoute un appel réseau, il le verra tout de suite.
    add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Polices et logo : stables, cache long. Ils pèsent ~1 Mo à eux seuls —
    # les re-télécharger à chaque visite sur un réseau ivoirien serait cher
    # payé pour un fichier qui ne change jamais.
    location ~* \.(otf|ttf|woff2?|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Page d'attente : cache court, pour qu'une correction (ou le lancement)
    # arrive vite chez les gens qui l'ont déjà ouverte.
    location / {
        add_header Cache-Control "public, max-age=300";
        add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
